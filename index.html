<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PollApp – Thumbnail</title>
    <link rel="stylesheet" href="styles/style.css">
  </head>
  <body>
    <main class="thumbnail">
      <div class="survey-preview">
        <img
          class="survey-preview-image"
          src="public/assets/images/survey-overview.png"
          alt="Vorschau der Umfrageübersicht"
        >
      </div>
      <div class="survey-summary">
        <img
          class="survey-summary-image"
          src="public/assets/images/survey-summary.png"
          alt="Vorschau einer Umfrage mit Ergebnissen"
        >
      </div>
      <h1 class="thumbnail-title">Poll App</h1>
      <div class="academy-logo">
        <img
          class="academy-icon"
          src="public/assets/icons/developer-akademie-icon.png"
          alt=""
        >
        <p class="academy-name">Developer<br>Akademie</p>
      </div>
    </main>
  </body>
</html>
