<!-- Home page with its logo, introduction, illustration and survey section. -->
<main class="home" aria-label="Umfrageübersicht">
  <!-- Brand logo at the top of the page. -->
  <header class="home-header">
    <img
      class="home-logo"
      src="assets/icons/poll-app-logo.png"
      alt="Poll App"
      width="119"
      height="46"
    >
  </header>
  <!-- Desktop layout with the introduction on the left and illustration on the right. -->
  <section class="home-hero" aria-labelledby="home-title">
    <div class="home-hero-content">
      <!-- Main headline with a fixed line break. -->
      <h1 id="home-title" class="home-title">Collect Feedback,<br>Unlock Ideas</h1>
      <!-- Short introduction to creating and sharing surveys. -->
      <p class="home-description">
        Create and share surveys in minutes – from team events to workplace culture.
        Collect opinions, engage your audience, and turn feedback into action.
      </p>
      <!-- New survey button with a plus icon that appears on hover. -->
      <button type="button" class="home-create-button">
        <span class="home-create-button-text">New survey</span>
        <img
          class="home-create-button-icon"
          src="assets/icons/add-circle.png"
          alt=""
          width="20"
          height="20"
        >
      </button>
    </div>
    <!-- Two overlapping images form the illustration's hover effect. -->
    <div class="home-visual">
      <!-- Keep this default image visible underneath the hover overlay. -->
      <img
        class="home-hero-image home-hero-image-default"
        src="assets/images/home-survey-default.png"
        alt=""
        width="426"
        height="420"
      >
      <!-- CSS fades this image in when the pointer enters the illustration. -->
      <img
        class="home-hero-image home-hero-image-hover"
        src="assets/images/home-survey-hover.png"
        alt=""
        width="426"
        height="420"
      >
    </div>
  </section>
  <!-- Survey section with its centered heading. -->
  <section class="home-surveys" aria-labelledby="home-surveys-title">
    <h2 id="home-surveys-title" class="home-surveys-title">Your surveys</h2>
    <!-- Label the surveys that are ending soon. -->
    <h3 class="home-surveys-subtitle">Ending soon surveys</h3>
    <!-- Three highlight cards for surveys that are ending soon. -->
    <div class="home-highlight-cards">
      <div class="home-highlight-card"></div>
      <div class="home-highlight-card"></div>
      <div class="home-highlight-card"></div>
    </div>
  </section>
</main>
