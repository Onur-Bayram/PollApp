<button
  type="button"
  class="category-button"
  [class.category-button-selected]="selectedCategory() !== ''"
  [attr.aria-expanded]="isOpen()"
  aria-controls="create-survey-category-menu"
  (click)="toggled.emit()"
>
  <span class="category-button-text">Choose category</span>
  <span class="category-button-arrow" aria-hidden="true">
    @if (isOpen()) {
      <img
        class="category-arrow-image"
        src="assets/icons/category-arrow-up-orange.png"
        alt=""
        width="24"
        height="24"
      />
    } @else {
      <img
        class="category-arrow-image category-arrow-default"
        src="assets/icons/category-arrow-down.png"
        alt=""
        width="24"
        height="24"
      />
      <img
        class="category-arrow-image category-arrow-hover"
        src="assets/icons/category-arrow-down-orange.png"
        alt=""
        width="15"
        height="8"
      />
    }
  </span>
</button>
@if (isOpen()) {
  <div id="create-survey-category-menu" class="create-survey-category-menu">
    @for (category of categories(); track category) {
      <button
        type="button"
        class="create-survey-category-menu-item"
        [class.create-survey-category-menu-item-selected]="selectedCategory() === category"
        [attr.aria-pressed]="selectedCategory() === category"
        (click)="categorySelected.emit(category)"
      >{{ category }}</button>
    }
  </div>
} @else if (selectedCategory()) {
  <div class="create-survey-category-selection">{{ selectedCategory() }}</div>
}
