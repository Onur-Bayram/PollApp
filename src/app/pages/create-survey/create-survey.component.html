<!-- White page background for creating a new survey. -->
<main class="create-survey-page" aria-labelledby="create-survey-title">
  <!-- Center the desktop design area in wider browser windows. -->
  <div class="create-survey-layout">
    <!-- Dark frame for the survey form. -->
    <div class="create-survey-frame">
      <!-- Keep the heading and form panel together. -->
      <div class="create-survey-content">
        <!-- Group the status, title and close button above the form. -->
        <div class="create-survey-heading">
          <!-- Show the current survey status inside its badge. -->
          <div class="create-survey-status">
            <span class="create-survey-status-text">Draft</span>
          </div>
          <!-- Place the close button to the right of the page title. -->
          <div class="create-survey-title-row">
            <h1 id="create-survey-title" class="create-survey-title">Create new survey</h1>
            <!-- Return to the home page immediately when clicked. -->
            <button
              type="button"
              class="create-survey-close-button"
              routerLink="/"
            >
              <!-- Visible label for cancelling survey creation. -->
              <span class="create-survey-close-button-text">Cancel</span>
              <!-- Decorative X icon next to the Cancel label. -->
              <span class="create-survey-close-button-icon" aria-hidden="true">
                <img src="assets/icons/close.png" alt="" />
              </span>
            </button>
          </div>
        </div>
        <!-- Inner panel for the survey details and questions. -->
        <div class="create-survey-form-panel">
          <!-- Arrange the survey details and description side by side. -->
          <div class="create-survey-details-row">
            <!-- Stack the survey name and the date/category row in the left column. -->
            <div class="create-survey-details-column">
              <!-- Keep the survey name label directly above its text input. -->
              <div class="create-survey-name-field">
                <label for="survey-name" class="create-survey-label create-survey-name-label">Survey name</label>
                <!-- Place the delete button beside the name input. -->
                <div class="create-survey-input-row">
                  <!-- Limit the survey name to 60 characters. -->
                  <input
                    id="survey-name"
                    type="text"
                    class="create-survey-input create-survey-name-input"
                    [formControl]="surveyName"
                    maxlength="60"
                  />
                  <!-- Clear only the survey name when this button is clicked. -->
                  <button
                    type="button"
                    class="create-survey-delete-button"
                    aria-label="Clear survey name"
                    (click)="clearSurveyName()"
                  >
                    <img src="assets/icons/delete.png" alt="" />
                  </button>
                </div>
              </div>
              <!-- Place the category button beside the end date field. -->
              <div class="create-survey-date-category-row">
                <!-- Keep the end date label above its smaller input. -->
                <div class="create-survey-end-date-field">
                  <label for="survey-end-date" class="create-survey-label create-survey-end-date-label">
                    Set end date (optional)
                  </label>
                  <!-- Place the delete button beside the end date input. -->
                  <div class="create-survey-input-row">
                    <!-- Allow up to 10 characters for a date in DD.MM.YYYY format. -->
                    <input
                      id="survey-end-date"
                      type="text"
                      class="create-survey-input create-survey-end-date-input"
                      [formControl]="endDate"
                      maxlength="10"
                    />
                    <!-- Clear only the end date when this button is clicked. -->
                    <button
                      type="button"
                      class="create-survey-delete-button"
                      aria-label="Clear end date"
                      (click)="clearEndDate()"
                    >
                      <img src="assets/icons/delete.png" alt="" />
                    </button>
                  </div>
                </div>
                <!-- Anchor the category menu below its button. -->
                <div class="create-survey-category-control">
                  <!-- Open or close the category menu when the button is clicked. -->
                  <button
                    type="button"
                    class="create-survey-category-button"
                    [class.create-survey-category-button-selected]="selectedCategory !== ''"
                    [attr.aria-expanded]="isCategoryMenuOpen"
                    aria-controls="create-survey-category-menu"
                    (click)="toggleCategoryMenu()"
                  >
                    <!-- Keep the button label unchanged after a selection. -->
                    <span class="create-survey-category-button-text">Choose category</span>
                    <!-- Switch between the supplied arrows inside the same icon area. -->
                    <span class="create-survey-category-button-arrow" aria-hidden="true">
                      @if (isCategoryMenuOpen) {
                        <img
                          class="create-survey-category-arrow-image"
                          src="assets/icons/category-arrow-up-orange.png"
                          alt=""
                          width="24"
                          height="24"
                        />
                      } @else {
                        <img
                          class="create-survey-category-arrow-image create-survey-category-arrow-default"
                          src="assets/icons/category-arrow-down.png"
                          alt=""
                          width="24"
                          height="24"
                        />
                        <img
                          class="create-survey-category-arrow-image create-survey-category-arrow-hover"
                          src="assets/icons/category-arrow-down-orange.png"
                          alt=""
                          width="15"
                          height="8"
                        />
                      }
                    </span>
                  </button>
                  @if (isCategoryMenuOpen) {
                    <!-- Repeat the topic options and highlight the selected category. -->
                    <div id="create-survey-category-menu" class="create-survey-category-menu">
                      @for (category of categories; track category) {
                        <button
                          type="button"
                          class="create-survey-category-menu-item"
                          [class.create-survey-category-menu-item-selected]="selectedCategory === category"
                          [attr.aria-pressed]="selectedCategory === category"
                          (click)="selectCategory(category)"
                        >{{ category }}</button>
                      }
                    </div>
                  } @else if (selectedCategory) {
                    <!-- Show the chosen category below the closed button. -->
                    <div class="create-survey-category-selection">{{ selectedCategory }}</div>
                  }
                </div>
              </div>
            </div>
            <!-- Keep the description label directly above its text area. -->
            <div class="create-survey-description-field">
              <label for="survey-description" class="create-survey-label create-survey-description-label">
                <span>Describing text</span>
                <span class="create-survey-description-optional">(optional)</span>
              </label>
              <!-- Place the delete button beside the description text area. -->
              <div class="create-survey-input-row create-survey-description-row">
                <!-- Limit the optional description to 300 characters. -->
                <textarea
                  id="survey-description"
                  class="create-survey-input create-survey-description-input"
                  [formControl]="description"
                  maxlength="300"
                ></textarea>
                <!-- Clear only the description when this button is clicked. -->
                <button
                  type="button"
                  class="create-survey-delete-button"
                  aria-label="Clear description"
                  (click)="clearDescription()"
                >
                  <img src="assets/icons/delete.png" alt="" />
                </button>
              </div>
            </div>
          </div>
          <!-- Place the question groups side by side below the survey details. -->
          <div class="create-survey-questions-row">
            <!-- Group the first question and its answers. -->
            <div class="create-survey-question-group">
              <!-- Keep the question label directly above its input. -->
              <div class="create-survey-question-field">
                <!-- Place the delete button beside the numbered question label. -->
                <div class="create-survey-question-header">
                  <label for="survey-question" class="create-survey-label create-survey-question-label">1. Question</label>
                  <!-- Clear only the question when this button is clicked. -->
                  <button
                    type="button"
                    class="create-survey-delete-button"
                    aria-label="Clear question"
                    (click)="clearQuestion()"
                  >
                    <img src="assets/icons/delete.png" alt="" />
                  </button>
                </div>
                <!-- Enter the survey question in this text field. -->
                <input
                  id="survey-question"
                  type="text"
                  class="create-survey-input create-survey-question-input"
                  [formControl]="question"
                />
              </div>
              <!-- Group the answer options below the question. -->
              <div class="create-survey-answers-group">
                <!-- Place the multiple answers option beside the heading. -->
                <div class="create-survey-answers-header">
                  <h2 class="create-survey-label create-survey-answers-label">Answers</h2>
                  <!-- Toggle the checkbox by clicking its box or text. -->
                  <label for="allow-multiple-answers" class="create-survey-multiple-answers-option">
                    <!-- Keep the 15px checkbox inside its padded 21px area. -->
                    <span class="create-survey-multiple-answers-icon">
                      <input
                        id="allow-multiple-answers"
                        type="checkbox"
                        class="create-survey-multiple-answers-checkbox"
                        [formControl]="allowMultipleAnswers"
                      />
                    </span>
                    <span class="create-survey-multiple-answers-text">Allow multiple answers.</span>
                  </label>
                </div>
                <!-- Stack the answer rows with space between them. -->
                <div class="create-survey-answer-list">
                  <!-- Place the letter, input and delete button in one row. -->
                  <div class="create-survey-answer-row">
                    <label for="survey-answer-a" class="create-survey-label create-survey-answer-label">A.</label>
                    <!-- Enter answer A for the first question. -->
                    <input
                      id="survey-answer-a"
                      type="text"
                      class="create-survey-input create-survey-answer-input"
                      [formControl]="answerA"
                    />
                    <!-- Clear only this answer when the delete button is clicked. -->
                    <button
                      type="button"
                      class="create-survey-delete-button"
                      aria-label="Clear answer A for question 1"
                      (click)="clearAnswerA()"
                    >
                      <img src="assets/icons/delete.png" alt="" />
                    </button>
                  </div>
                  <!-- Place answer B below answer A using the same field styles. -->
                  <div class="create-survey-answer-row create-survey-answer-row-b">
                    <label for="survey-answer-b" class="create-survey-label create-survey-answer-label">B.</label>
                    <!-- Enter answer B for the first question. -->
                    <input
                      id="survey-answer-b"
                      type="text"
                      class="create-survey-input create-survey-answer-input"
                      [formControl]="answerB"
                    />
                    <!-- Clear only this answer when the delete button is clicked. -->
                    <button
                      type="button"
                      class="create-survey-delete-button"
                      aria-label="Clear answer B for question 1"
                      (click)="clearAnswerB()"
                    >
                      <img src="assets/icons/delete.png" alt="" />
                    </button>
                  </div>
                </div>
              </div>
            </div>
            <!-- Group the second question with its label and delete button. -->
            <div class="create-survey-question-group">
              <!-- Keep the second question label directly above its input. -->
              <div class="create-survey-question-field">
                <div class="create-survey-question-header create-survey-second-question-header">
                  <label for="survey-second-question" class="create-survey-label create-survey-question-label">2. Question</label>
                  <!-- Clear only the second question when this button is clicked. -->
                  <button
                    type="button"
                    class="create-survey-delete-button"
                    aria-label="Clear second question"
                    (click)="clearSecondQuestion()"
                  >
                    <img src="assets/icons/delete.png" alt="" />
                  </button>
                </div>
                <!-- Enter the second question using the same input style. -->
                <input
                  id="survey-second-question"
                  type="text"
                  class="create-survey-input create-survey-question-input"
                  [formControl]="secondQuestion"
                />
              </div>
              <!-- Use the same answer layout for the second question. -->
              <div class="create-survey-answers-group">
                <!-- Place the second question's multiple answers option beside the heading. -->
                <div class="create-survey-answers-header">
                  <h2 class="create-survey-label create-survey-answers-label">Answers</h2>
                  <!-- Toggle only the second question's multiple answers option. -->
                  <label for="allow-multiple-answers-second" class="create-survey-multiple-answers-option">
                    <!-- Keep the checkbox inside the same padded icon area. -->
                    <span class="create-survey-multiple-answers-icon">
                      <input
                        id="allow-multiple-answers-second"
                        type="checkbox"
                        class="create-survey-multiple-answers-checkbox"
                        [formControl]="secondAllowMultipleAnswers"
                      />
                    </span>
                    <span class="create-survey-multiple-answers-text">Allow multiple answers.</span>
                  </label>
                </div>
                <!-- Stack the second question's answers with the same spacing. -->
                <div class="create-survey-answer-list">
                  <!-- Place answer A beside its letter and delete button. -->
                  <div class="create-survey-answer-row">
                    <label for="survey-second-answer-a" class="create-survey-label create-survey-answer-label">A.</label>
                    <!-- Enter answer A for the second question. -->
                    <input
                      id="survey-second-answer-a"
                      type="text"
                      class="create-survey-input create-survey-answer-input"
                      [formControl]="secondAnswerA"
                    />
                    <!-- Clear only answer A for the second question. -->
                    <button
                      type="button"
                      class="create-survey-delete-button"
                      aria-label="Clear answer A for question 2"
                      (click)="clearSecondAnswerA()"
                    >
                      <img src="assets/icons/delete.png" alt="" />
                    </button>
                  </div>
                  <!-- Place answer B below answer A using the same field styles. -->
                  <div class="create-survey-answer-row create-survey-answer-row-b">
                    <label for="survey-second-answer-b" class="create-survey-label create-survey-answer-label">B.</label>
                    <!-- Enter answer B for the second question. -->
                    <input
                      id="survey-second-answer-b"
                      type="text"
                      class="create-survey-input create-survey-answer-input"
                      [formControl]="secondAnswerB"
                    />
                    <!-- Clear only answer B for the second question. -->
                    <button
                      type="button"
                      class="create-survey-delete-button"
                      aria-label="Clear answer B for question 2"
                      (click)="clearSecondAnswerB()"
                    >
                      <img src="assets/icons/delete.png" alt="" />
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>
